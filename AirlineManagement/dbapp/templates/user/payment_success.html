{% extends "base.html" %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg p-5 rounded-4">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                </div>
                <h2 class="fw-bold text-navy">Payment Successful!</h2>
                <p class="text-muted mb-4">Your journey with Boundless Air is confirmed. A copy of your e-ticket has been generated.</p>
                
                <div class="d-grid gap-3">
                    <a href="/download_ticket/{{ b_id }}" class="btn btn-primary py-3 fw-bold rounded-pill">
                        <i class="bi bi-file-earmark-pdf me-2"></i>DOWNLOAD E-TICKET
                    </a>
                    <a href="{{ url_for('user.dashboard') }}" class="btn btn-outline-navy py-3 fw-bold rounded-pill">
                        GO TO MY DASHBOARD
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
