<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Boundless Air</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

    <div class="admin-wrapper">
        <!-- FIXED SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" height="40" style="filter: brightness(0) invert(1);">
                <div class="mt-2 small fw-bold text-uppercase tracking-wider opacity-50">Admin Center</div>
            </div>
            
            <nav class="mt-3">
                <a href="{{ url_for('admin.dashboard') }}" class="nav-link active">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
                <a href="{{ url_for('admin.manage_flights') }}" class="nav-link {% if request.endpoint == 'admin.manage_flights' %}active{% endif %}">
                    <i class="bi bi-airplane-fill"></i> Flights
                </a>
                <a href="{{ url_for('admin.manage_bookings') }}" class="nav-link {% if request.endpoint == 'admin.manage_bookings' %}active{% endif %}">
                    <i class="bi bi-journal-bookmark-fill"></i> Bookings
                </a>
                <a href="{{ url_for('admin.manage_users') }}" class="nav-link">
                    <i class="bi bi-people-fill"></i> Users
                </a>
                <a href="{{ url_for('admin.manage_offers') }}" class="nav-link {% if request.endpoint == 'admin.manage_offers' %}active{% endif %}">
                    <i class="bi bi-tags-fill"></i> Offers
                </a>
                
                <div style="margin-top: 100px;">
                    <a href="{{ url_for('auth.logout') }}" class="nav-link text-danger">
                        <i class="bi bi-box-arrow-left"></i> Logout
                    </a>
                </div>
            </nav>
        </aside>

        <!-- SCROLLABLE MAIN CONTENT -->
        <main class="main-content">
            <header class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold text-navy mb-0">Control Tower</h2>
                    <p class="text-muted small">Real-time aviation metrics & management</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small">{{ today_date }}</span>
                    <div class="bg-white p-2 px-3 rounded-pill shadow-sm border small fw-bold">
                        <i class="bi bi-person-circle me-1 text-primary"></i> Super Admin
                    </div>
                </div>
            </header>

            {% block admin_content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
